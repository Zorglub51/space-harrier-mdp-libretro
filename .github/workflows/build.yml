name: Build cores

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      platform:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 7zip \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev mesa-common-dev
      - name: Prepare pinned MAME tree
        run: ./scripts/fetch-mame.sh
      - name: Build
        env:
          PLATFORM: linux
        run: ./scripts/build-libretro.sh
      - name: Package
        run: ./scripts/package-core.sh build/mame linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: space-harrier-mdp-linux-x86_64
          path: out/*.7z*
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows x86_64
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 7zip mingw-w64 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
      - name: Prepare pinned MAME tree
        run: ./scripts/fetch-mame.sh
      - name: Build
        env:
          PLATFORM: win
          CC: x86_64-w64-mingw32-gcc-posix
          CXX: x86_64-w64-mingw32-g++-posix
          AR: x86_64-w64-mingw32-ar
        run: ./scripts/build-libretro.sh
      - name: Package
        run: ./scripts/package-core.sh build/mame windows-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: space-harrier-mdp-windows-x86_64
          path: out/*.7z*
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install archive tool
        run: brew install sevenzip
      - name: Prepare pinned MAME tree
        run: ./scripts/fetch-mame.sh
      - name: Build
        env:
          PLATFORM: osx
          MACOS_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-libretro.sh
      - name: Verify core architecture
        run: lipo build/mame/shmdp_libretro.dylib -verify_arch "${{ matrix.arch }}"
      - name: Package
        run: ./scripts/package-core.sh build/mame "macos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: space-harrier-mdp-macos-${{ matrix.arch }}
          path: out/*.7z*
          compression-level: 0
          if-no-files-found: error
