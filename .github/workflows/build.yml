name: Build cores

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      platform:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - trimui-smart-pro-nextui
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 7zip \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev mesa-common-dev
      - name: Prepare pinned MAME tree
        run: ./scripts/fetch-mame.sh
      - name: Build
        env:
          PLATFORM: linux
        run: ./scripts/build-libretro.sh
      - name: Package
        run: ./scripts/package-core.sh build/mame linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: space-harrier-mdp-linux-x86_64
          path: out/*.7z*
          compression-level: 0
          if-no-files-found: error

  trimui-smart-pro-nextui:
    name: TrimUI Smart Pro (NextUI)
    timeout-minutes: 60
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'trimui-smart-pro-nextui'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils git python3 7zip
      - name: Install pinned Zig compiler
        run: |
          archive=zig-aarch64-linux-0.16.0.tar.xz
          curl --fail --location --retry 3 "https://ziglang.org/download/0.16.0/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${archive%.tar.xz}" >> "${GITHUB_PATH}"
      - name: Prepare pinned MAME tree
        run: ./scripts/fetch-mame.sh
      - name: Build
        env:
          PLATFORM: trimui-smart-pro-nextui
        run: ./scripts/build-libretro.sh
      - name: Package NextUI pak
        run: ./scripts/package-core.sh build/mame trimui-smart-pro-nextui
      - name: Check packaged ELF and run the ARM64 core
        run: |
          extracted="${RUNNER_TEMP}/trimui-package"
          seven_zip=$(command -v 7zz || command -v 7z)
          "${seven_zip}" x -y "-o${extracted}" out/*-trimui-smart-pro-nextui.7z
          core=$(find "${extracted}" -type f -path '*/Emus/tg5040/SHMDP.pak/shmdp_libretro.so')
          python3 scripts/verify-trimui-core.py "${core}"
          python3 tests/libretro_public_smoke.py --core "${core}" \
            --output "${RUNNER_TEMP}/trimui-smoke.json"
          python3 tests/libretro_public_smoke.py --core "${core}" --threaded \
            --output "${RUNNER_TEMP}/trimui-smoke-threaded.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trimui-runtime-report
          path: ${{ runner.temp }}/trimui-smoke*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: space-harrier-mdp-trimui-smart-pro-nextui
          path: out/*.7z*
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows x86_64
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 7zip mingw-w64 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
      - name: Prepare pinned MAME tree
        run: ./scripts/fetch-mame.sh
      - name: Build
        env:
          PLATFORM: win
          CC: x86_64-w64-mingw32-gcc-posix
          CXX: x86_64-w64-mingw32-g++-posix
          AR: x86_64-w64-mingw32-ar
        run: ./scripts/build-libretro.sh
      - name: Package
        run: ./scripts/package-core.sh build/mame windows-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: space-harrier-mdp-windows-x86_64
          path: out/*.7z*
          compression-level: 0
          if-no-files-found: error

  windows-runtime:
    name: Windows x64 runtime smoke test
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v8
        with:
          name: space-harrier-mdp-windows-x86_64
          path: downloads
      - name: Load, run, save and restore the packaged DLL
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 downloads
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-runtime-report
          path: test-results/windows-runtime/*
          if-no-files-found: warn

  macos:
    name: macOS ${{ matrix.arch }}
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install archive tool
        run: brew install sevenzip
      - name: Prepare pinned MAME tree
        run: ./scripts/fetch-mame.sh
      - name: Build
        env:
          PLATFORM: osx
          MACOS_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-libretro.sh
      - name: Verify core architecture
        run: lipo build/mame/shmdp_libretro.dylib -verify_arch "${{ matrix.arch }}"
      - name: Package
        run: ./scripts/package-core.sh build/mame "macos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: space-harrier-mdp-macos-${{ matrix.arch }}
          path: out/*.7z*
          compression-level: 0
          if-no-files-found: error
