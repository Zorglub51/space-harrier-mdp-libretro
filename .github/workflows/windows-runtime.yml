name: Check published Windows runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to execute on native Windows x64
        required: true
        default: v0.1.20
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download published core
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          gh release download $env:RELEASE_TAG --pattern '*windows-x86_64.7z' --dir downloads
          if ($LASTEXITCODE) { throw 'Release download failed' }
      - name: Run generated-cartridge smoke tests
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 downloads
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-runtime-${{ inputs.tag }}
          path: test-results/windows-runtime/*
          if-no-files-found: warn

